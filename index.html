<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wellington Webcams - Clean Feeds & Fullscreen</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #000; overflow: hidden;
            font-family: sans-serif;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(2, 1fr);
            width: 100vw; height: 100vh; gap: 2px;
        }

        .cam-container {
            position: relative; width: 100%; height: 100%;
            background-color: #111; overflow: hidden; 
        }

        /* Standard iframe styling for direct video URLs */
        .direct-feed {
            width: 100%; height: 100%; border: none;
        }

        /* --- IFRAME CROPPING CLASSES --- */
        .crop-worser {
            width: 140%; height: 160%; border: none;
            position: absolute; top: -35%; left: -20%;
        }

        .crop-eastbourne {
            width: 120%; height: 150%; border: none;
            position: absolute; top: -25%; left: -10%;
        }

        .crop-palliser {
            width: 130%; height: 150%; border: none;
            position: absolute; top: -30%; left: -15%;
        }

        .crop-tora {
            width: 150%; height: 180%; border: none;
            position: absolute; top: -40%; left: -25%;
        }

        /* --- INTERACTIVE UI ELEMENTS --- */
        
        /* Clickable Labels */
        .label {
            position: absolute; top: 10px; left: 10px;
            background-color: rgba(0, 0, 0, 0.8); color: white;
            padding: 5px 10px; font-size: 14px; font-weight: bold; 
            border-radius: 4px; z-index: 10; text-decoration: none;
            border: 1px solid transparent;
            transition: all 0.2s ease;
        }

        .label:hover {
            background-color: rgba(0, 0, 0, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.5);
            color: #4da6ff;
       } 

        /* Fullscreen Button */
        .fullscreen-btn {
            position: absolute; top: 10px; right: 10px;
            background-color: rgba(0, 0, 0, 0.8); color: white;
            width: 30px; height: 30px; border-radius: 4px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; z-index: 10;
            transition: background-color 0.2s ease;
            border: 1px solid transparent;
        }

        .fullscreen-btn:hover {
            background-color: rgba(0, 0, 0, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .fullscreen-btn svg {
            width: 16px; height: 16px; fill: currentColor;
        }

        @media (max-width: 1024px) {
            .grid-container {
                grid-template-columns: repeat(2, 1fr);
                grid-template-rows: repeat(3, 1fr);
            }
        }
    </style>
</head>
<body>

    <script>
        function toggleFullScreen(paneId) {
            const pane = document.getElementById(paneId);
            
            if (!document.fullscreenElement) {
                // If not in fullscreen, request it for the specific pane
                if (pane.requestFullscreen) {
                    pane.requestFullscreen();
                } else if (pane.webkitRequestFullscreen) { /* Safari */
                    pane.webkitRequestFullscreen();
                } else if (pane.msRequestFullscreen) { /* IE11 */
                    pane.msRequestFullscreen();
                }
            } else {
                // If already in fullscreen, exit it
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) { /* Safari */
                    document.webkitExitFullscreen();
                } else if (document.msExitFullscreen) { /* IE11 */
                    document.msExitFullscreen();
                }
            }
        }
    </script>
